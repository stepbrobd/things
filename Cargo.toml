[package]
name        = "things"
version     = "2026.918.1"
edition     = "2024"
autobins    = false
description = "Command-line client for Things 3 using the Things Cloud API"
license     = "MIT"
repository  = "https://github.com/stepbrobd/things"
homepage    = "https://github.com/stepbrobd/things"
readme      = "readme.md"

[[bin]]
name = "things"
path = "src/main.rs"

[dependencies]
anyhow                = "1.0"
chrono                = { version = "0.4", features = ["clock"] }
clap                  = { version = "4.6", features = ["derive"] }
clap_complete         = "4.6"
clap_complete_nushell = "4"
console               = "0.15"
crc32fast             = "1.5"
dirs                  = "6.0"
iocraft               = "0.7.18"
num_enum              = "0.7"
rand                  = "0.10"
reqwest               = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rpassword             = "7"
serde                 = { version = "1.0", features = ["derive"] }
serde_json            = "1.0"
sha1                  = "0.10"
strum                 = { version = "0.28", features = ["derive"] }
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
urlencoding           = "2.1"
uuid                  = { version = "1.22", features = ["v4"] }

[dev-dependencies]
insta    = "1.46"
tempfile = "3"
trycmd   = "0.15"
